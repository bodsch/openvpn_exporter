name: CI

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
        type: choice
        options:
          - info
          - warning
          - debug
      release_tag:
        description: "Release tag to publish to (required for manual run, e.g. 0.1.0 or v0.1.0)"
        required: false
        default: ""
        type: string

  push:
    branches:
      - "main"
      - "feature/**"
      - "!doc/**"
    tags:
      - "*.*.*"
    paths-ignore:
      - "README.md"

  pull_request:
    branches:
      - "main"
      - "feature/**"
      - "!doc/**"
    paths-ignore:
      - "README.md"

jobs:
  verify:
    name: "verify (go ${{ matrix.go }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.27"
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # a manual release verifies the tag it publishes, not the branch
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Go version
        run: go version

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # Builds with the Makefile (the same `make dist` that runs locally) and
  # publishes with the preinstalled gh CLI, so no third-party action gets
  # the write token. Runs only after verify passed for the same commit.
  release:
    name: release
    runs-on: ubuntu-22.04
    needs: verify
    if: >
      startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
    env:
      # Passed via env instead of ${{ }} in run scripts, so a crafted tag
      # name cannot inject shell code.
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives
        run: make dist VERSION="$TAG"

      - name: Publish release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "$TAG" --generate-notes
          fi
